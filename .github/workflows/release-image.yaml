name: Publish GitHub release image

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

env:
  CI: 'true'
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tjallo/keybridge

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps

      - name: Run repository checks
        run: |
          npm run format:check
          npm run check
          npm test
          npm run test:integration
          npm run test:e2e
          npm run build

      - name: Validate package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Read source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: .
          target: runtime
          push: true
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
