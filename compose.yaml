services:
  keybridge:
    build:
      context: .
      target: runtime
      args:
        SOURCE_COMMIT: '${SOURCE_COMMIT:?Set SOURCE_COMMIT to the source commit}'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      {
        test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/health],
        interval: 10s,
        timeout: 3s,
        retries: 3,
      }
    stop_grace_period: 10s
