name: Publish release image

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: gitea.tailebf42a.ts.net
  IMAGE: gitea.tailebf42a.ts.net/tjallo/keybridge

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate package version
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Read source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
