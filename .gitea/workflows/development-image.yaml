name: Publish development image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: gitea.tailebf42a.ts.net
  IMAGE: gitea.tailebf42a.ts.net/tjallo/keybridge

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Read source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: tjallo
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=development

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          builder: default
          context: .
          target: runtime
          push: true
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
