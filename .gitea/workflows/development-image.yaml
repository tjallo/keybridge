name: Publish development image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: gitea.tailebf42a.ts.net
  IMAGE: gitea.tailebf42a.ts.net/tjallo/keybridge

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: tjallo
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=development

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
