name: Publish release image

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

env:
  CI: 'true'
  REGISTRY: gitea.tailebf42a.ts.net
  IMAGE: gitea.tailebf42a.ts.net/tjallo/keybridge

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /dev/shm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        run: npx playwright install --only-shell chromium firefox webkit

      - name: Run repository checks
        run: |
          npm run format:check
          npm run check
          npm test
          npm run test:integration
          npm run test:e2e
          npm run build

      - name: Validate package version
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Read source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: tjallo
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: .
          target: runtime
          push: true
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
