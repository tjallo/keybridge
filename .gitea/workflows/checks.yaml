name: Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

env:
  CI: 'true'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /dev/shm

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        run: npx playwright install --only-shell chromium firefox webkit

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build production artifacts
        env:
          SOURCE_COMMIT: ${{ gitea.sha }}
        run: npm run build
